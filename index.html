<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모두의 IT</title>
<meta name="description" content="매일 오전 8시, 오후 5시. IT·AI 뉴스를 카드뉴스 5편으로 정리합니다. @it_4_all">
<meta property="og:title" content="모두의 IT · 오늘의 IT·AI 카드뉴스">
<meta property="og:description" content="매일 오전 8시, 오후 5시 업데이트. 카드 이미지와 캡션을 바로 받아 가세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 회차 선택 칩 → 시리즈별 카드 레일 + 캡션/다운로드 패널 */
:root{
  --bg:#E6E8EC; --surface:#FFFFFF; --fg:#15171B; --muted:#5B606B; --line:#CDD1D8; --ink:#15171B; --on-ink:#FFFFFF;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#111317;--surface:#1A1D23;--fg:#ECEEF2;--muted:#9AA0AB;--line:#2C3038;--ink:#ECEEF2;--on-ink:#111317;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 24px}
.brand{font-family:var(--display);font-size:clamp(34px,6vw,52px);line-height:1;margin:0;font-weight:400}
.brand a{color:inherit;text-decoration:none}
.handle{display:inline-block;margin-top:10px;font-weight:700;color:var(--fg);text-decoration:none;border-bottom:2px solid currentColor}
.lead{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.btn{appearance:none;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn:hover{border-color:var(--fg)}
.btn:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:progress}
.editions{display:flex;gap:8px;overflow-x:auto;margin:28px 0 8px;padding-bottom:6px}
.chip{flex:none;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-current="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip .new{font-family:var(--display);font-weight:400;font-size:11px;margin-left:6px;padding:1px 6px;border-radius:4px;background:#FF5A3C;color:#fff}
.edhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:18px 0;border-top:2px solid var(--fg)}
.edhead h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,30px)}
.edhead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.series{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:26px 0;border-top:1px solid var(--line)}
@media (max-width:900px){.series{grid-template-columns:minmax(0,1fr)}}
.stitle{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-width:0}
.stitle .no{font-family:var(--display);font-size:14px;padding:3px 8px;border-radius:4px;flex:none}
.stitle h3{margin:0;font-size:17px;font-weight:700;min-width:0}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.shot{flex:none;width:min(70vw,250px);scroll-snap-align:start;position:relative;margin:0}
.shot img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--line)}
.shot a.dl{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none}
.shot a.dl:hover{color:var(--fg);text-decoration:underline}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start}
.panel h4{margin:0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.cap{white-space:pre-wrap;font-family:var(--body);font-size:13.5px;line-height:1.65;max-height:260px;overflow:auto;margin:0;padding-right:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:20}
.empty{padding:60px 0;color:var(--muted)}
footer{margin-top:48px;color:var(--muted);font-size:12.5px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand"><a href="./">모두의 IT</a></h1>
      <a class="handle" href="https://www.instagram.com/it_4_all/" target="_blank" rel="noopener">@it_4_all</a>
      <p class="lead">매일 오전 8시, 오후 5시. 오늘의 IT·AI 뉴스를 카드뉴스 5편으로 정리해요.<br>카드 이미지와 인스타그램 캡션을 바로 받아 가세요.</p>
    </div>
  </header>

  <nav class="editions" id="editions" aria-label="회차 선택"></nav>
  <main id="edition"><p class="empty">불러오는 중…</p></main>

  <footer>
    뉴스 내용은 각 카드 하단과 마지막 장에 적힌 기사를 바탕으로 정리했습니다. 사진은 위키미디어 공용 등의 자유 라이선스 이미지이며, 작가와 라이선스를 사진 위에 표기했습니다. 게시할 때 사진 출처 표기를 지우지 마세요.<br>
    © 모두의 IT · @it_4_all
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let editions = [], current = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast("캡션을 복사했어요"); }
  catch{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("캡션을 복사했어요");}catch{toast("복사하지 못했어요. 직접 선택해서 복사해 주세요");} ta.remove(); }
}

async function zipFiles(name, items, button){
  const label=button.textContent; button.disabled=true; button.textContent="압축하는 중…";
  try{
    const zip=new JSZip();
    for(const it of items){
      if(it.text!=null) zip.file(it.name,it.text);
      else { const r=await fetch(it.url); if(!r.ok) throw new Error(it.url); zip.file(it.name, await r.blob()); }
    }
    saveBlob(await zip.generateAsync({type:"blob"}), name);
    toast("다운로드를 시작했어요");
  }catch(e){ toast("파일을 받지 못했어요. 잠시 뒤 다시 시도해 주세요"); }
  finally{ button.disabled=false; button.textContent=label; }
}

function renderChips(){
  $("#editions").innerHTML = editions.map((e,i)=>
    `<button class="chip" type="button" data-id="${e.id}" aria-current="${current&&current.id===e.id}">${esc(e.label)}${i===0?'<span class="new">NEW</span>':''}</button>`).join("");
}

async function show(id){
  const meta = editions.find(e=>e.id===id) || editions[0];
  if(!meta){ $("#edition").innerHTML='<p class="empty">아직 올라온 카드뉴스가 없어요.</p>'; return; }
  const base=`editions/${meta.id}/`;
  const r=await fetch(base+"edition.json",{cache:"no-cache"});
  current=await r.json(); current.base=base;
  renderChips();
  if(location.hash.slice(1)!==current.id) history.replaceState(null,"","#"+current.id);
  $("#edition").innerHTML = `
    <div class="edhead"><div><h2>${esc(current.label)} 카드뉴스</h2><p>5편 · 카드 ${current.series.reduce((a,s)=>a+s.images.length,0)}장 · 1080×1350 (인스타그램 4:5)</p></div>
      <div class="actions"><button class="btn primary" type="button" data-act="all">이번 회차 전체 받기 (ZIP)</button><a class="btn" href="${base}captions.txt" download="모두의IT_${current.id}_캡션.txt">캡션 전체 .txt</a></div></div>
    ${current.series.map((s,k)=>`
    <section class="series" id="s-${s.id}">
      <div style="min-width:0">
        <div class="stitle"><span class="no" style="background:${s.acc};color:${s.ink}">NEWS ${String(k+1).padStart(2,"0")}</span><h3>${esc(s.headline||s.title)}</h3></div>
        <div class="rail">${s.images.map((f,i)=>`<figure class="shot"><img src="${base}${f}" alt="${esc(s.title)} ${i+1}번째 카드" loading="${k<1?'eager':'lazy'}" width="1080" height="1350"><a class="dl" href="${base}${f}" download="${f}">↓ ${i+1}번 카드 저장</a></figure>`).join("")}</div>
      </div>
      <aside class="panel">
        <h4>인스타그램 캡션</h4>
        <pre class="cap">${esc(s.caption)}</pre>
        <div class="actions">
          <button class="btn primary" type="button" data-act="copy" data-k="${k}">캡션 복사</button>
          <button class="btn" type="button" data-act="zip" data-k="${k}">카드 ${s.images.length}장 + 캡션 받기</button>
        </div>
      </aside>
    </section>`).join("")}`;
}

document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(chip){ location.hash=chip.dataset.id; return; }
  const b=e.target.closest("[data-act]"); if(!b||!current) return;
  const s=current.series[b.dataset.k];
  if(b.dataset.act==="copy") copyText(s.caption);
  if(b.dataset.act==="zip") zipFiles(`모두의IT_${current.id}_${String(+b.dataset.k+1).padStart(2,"0")}_${s.id}.zip`,
      [...s.images.map(f=>({name:f,url:current.base+f})),{name:"캡션.txt",text:s.caption}], b);
  if(b.dataset.act==="all") zipFiles(`모두의IT_${current.id}.zip`,
      [...current.series.flatMap(x=>x.images.map(f=>({name:f,url:current.base+f}))),
       {name:"캡션.txt",text:current.series.map((x,i)=>`[${String(i+1).padStart(2,"0")}] ${x.title}\n\n${x.caption}`).join("\n\n\n")}], b);
});
addEventListener("hashchange",()=>show(location.hash.slice(1)));

(async()=>{
  try{
    editions=await (await fetch("editions.json",{cache:"no-cache"})).json();
    await show(location.hash.slice(1));
  }catch{ $("#edition").innerHTML='<p class="empty">카드뉴스를 불러오지 못했어요. 새로고침해 주세요.</p>'; }
})();
</script>
</body>
</html>
